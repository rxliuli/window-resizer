name: Release

on:
  push:
    branches: [main]
    paths:
      - 'Resources/Info.plist'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: version
        run: |
          read_version() {
            python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleShortVersionString'])" "$1"
          }
          CURRENT=$(read_version Resources/Info.plist)
          PREVIOUS=""
          if git show HEAD~1:Resources/Info.plist > /tmp/prev.plist 2>/dev/null; then
            PREVIOUS=$(read_version /tmp/prev.plist || true)
          fi
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          if [[ "${CURRENT}" != "${PREVIOUS}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    environment: release-macOS

    steps:
      - uses: actions/checkout@v6

      # .xcodeproj 是 xcodegen 的产物（已在 .gitignore 里），CI 上必须现生成。
      # 用 project.yml 而不是提交 project.pbxproj：手工维护的工程文件会腐烂 ——
      # 加个源文件忘了同步，archive 就编译不过（AppDowngrader 的 pbxproj 就是这么坏的）。
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # archive → Developer ID 签名 → DMG → 公证 → 盖章 → Gatekeeper 校验。
      # 规则与「为什么」都在共享 action 那边：https://github.com/rxliuli/apple-release
      # （直发为什么必须显式钉签名身份、为什么 create-dmg 之后还要 stapler validate、
      # 为什么证书要先导入合集 p12 —— README 里都有）
      - uses: rxliuli/apple-release/dmg@v1
        id: dmg
        with:
          project: WindowResizer.xcodeproj
          scheme: WindowResizer
          version: ${{ needs.check-version.outputs.version }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v7
        with:
          name: WindowResizer-macos
          path: ${{ steps.dmg.outputs.dmg-path }}

  release:
    needs: [check-version, build-macos]
    runs-on: ubuntu-latest
    # TAP_GITHUB_TOKEN 是可选的：没配就跳过 cask bump。secrets 不能出现在 if 条件里
    # （steps.if 拿不到 secrets context），所以先落到 job 级 env，再用 env.TAP_TOKEN 判断。
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --generate-notes \
            artifacts/*

      # 只改 tap 里 cask 的 version / sha256 两行，livecheck / caveats / zap 原样保留；
      # 改不动会直接失败，不像手写 sed 那样静默通过。
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        uses: rxliuli/apple-release/tap-update@v1
        with:
          cask: window-resizer
          version: ${{ needs.check-version.outputs.version }}
          artifact: artifacts/WindowResizer-macos.dmg
          token: ${{ env.TAP_TOKEN }}
