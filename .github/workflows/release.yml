name: Release

on:
  push:
    branches: [main]
    paths:
      # The single source of truth for the version is MARKETING_VERSION in project.yml
      - 'project.yml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Must be >= 2: version-check reads the previous commit to compare against
          fetch-depth: 2
      # The version is read from settings.base.MARKETING_VERSION in project.yml
      # (Resources/Info.plist holds a $(MARKETING_VERSION) template). This action understands
      # XcodeGen specs natively, so the path is located automatically.
      - id: version
        uses: rxliuli/version-check@v1
        with:
          file: project.yml

  build-macos:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    environment: release-macOS

    steps:
      - uses: actions/checkout@v6

      # .xcodeproj is a xcodegen product (gitignored), so CI has to generate it.
      # Using project.yml instead of committing a project.pbxproj: a hand-maintained project
      # file rots - AppDowngrader's did, a source file added later was never synced into it and
      # archive stopped compiling.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # archive -> Developer ID sign -> DMG -> notarize -> staple -> Gatekeeper check.
      # The rules and the reasoning behind them live in the shared action:
      # https://github.com/rxliuli/apple-release (why a direct download has to pin the signing
      # identity, why create-dmg is followed by stapler validate, why the certificate is imported
      # as a bundle p12 - all covered in its README)
      - uses: rxliuli/apple-release/dmg@v1
        id: dmg
        with:
          project: WindowResizer.xcodeproj
          scheme: WindowResizer
          version: ${{ needs.check-version.outputs.version }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v7
        with:
          name: WindowResizer-macos
          path: ${{ steps.dmg.outputs.dmg-path }}

  release:
    needs: [check-version, build-macos]
    runs-on: ubuntu-latest
    # TAP_GITHUB_TOKEN is optional: when it is not set the cask bump is skipped. `secrets` cannot
    # be used in an `if` condition (the secrets context is unavailable in steps.if), so it goes
    # through a job-level env and the step tests env.TAP_TOKEN instead.
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --generate-notes \
            artifacts/*

      # Rewrites only the cask's version / sha256 lines and leaves livecheck / caveats / zap
      # alone; if it cannot rewrite them it fails loudly, unlike a hand-written sed that would
      # silently succeed.
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        uses: rxliuli/apple-release/tap-update@v1
        with:
          cask: window-resizer
          version: ${{ needs.check-version.outputs.version }}
          artifact: artifacts/WindowResizer-macos.dmg
          token: ${{ env.TAP_TOKEN }}
