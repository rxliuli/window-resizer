name: WindowResizer

# This file is the single source of truth for the .xcodeproj (the generated one is gitignored).
# Why xcodegen: a hand-maintained project.pbxproj rots - that is exactly how AppDowngrader broke
# (a newly added Logger.swift was never synced into the pbxproj, and xcodebuild archive failed
# with cannot find 'Logger' in scope).
#
# Why an .xcodeproj at all, rather than just Package.swift: SwiftPM is a build system for
# libraries and CLIs, and it does not produce a .app - no bundle layout, no Info.plist placement,
# no signing, no notarization. Those are exactly what shipping needs, and only
# `xcodebuild archive` hands them to you. Package.swift stays for the `swift run` / `swift test`
# development loop (both share the same Sources; no code is duplicated).

options:
  bundleIdPrefix: com.rxliuli
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The **single source of truth** for the version is right here: Resources/Info.plist holds
    # $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION), substituted by Xcode at build time.
    # The release CI reads this file with rxliuli/version-check to decide whether to publish, so
    # a version bump is a one-line change here and nowhere else.
    MARKETING_VERSION: "0.3.3"
    # The build number is derived from the version as x*10000 + y*100 + z (0.3.3 -> 303).
    # dmg.sh computes the same value in CI and overrides this; the value here only serves local
    # archives.
    CURRENT_PROJECT_VERSION: "303"
    DEAD_CODE_STRIPPING: YES
    # No run script phases here; set it now to establish the rule for later (same as linkpure).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N2X78TUUFG

targets:
  WindowResizer:
    type: application
    platform: macOS
    sources:
      - path: Sources/WindowResizer
      # Convention: whatever is in Resources/ lands verbatim in Contents/Resources/.
      # Info.plist has to be excluded - leaving it in Copy Bundle Resources makes Xcode fail
      # outright - and INFOPLIST_FILE below turns it into Contents/Info.plist instead.
      # tray-icon.png is carried along by exactly this convention (the code reads it with
      # Bundle.main).
      - path: Resources
        excludes:
          - Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: WindowResizer
        PRODUCT_BUNDLE_IDENTIFIER: com.rxliuli.window-resizer
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
